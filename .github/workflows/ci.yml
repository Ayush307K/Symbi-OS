name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret and sensitive-file scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject sensitive files anywhere in Git history
        run: node scripts/check-sensitive-files.mjs --history

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  quality:
    name: Typecheck, test, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      # Ephemeral service container below. No pooler sits in front of it, so the
      # pooled and direct URLs are the same host; they diverge only on managed
      # providers. TEST_DATABASE_URL is the same database because the runner is
      # torn down after the job.
      DATABASE_URL: postgresql://symbi:symbi_local_dev@localhost:5432/symbi_dev
      DIRECT_URL: postgresql://symbi:symbi_local_dev@localhost:5432/symbi_dev
      TEST_DATABASE_URL: postgresql://symbi:symbi_local_dev@localhost:5432/symbi_dev
      APP_URL: http://localhost:3000
      DEMO_VERIFICATION_ENABLED: "false"
      DEMO_PAYMENTS_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: symbi
          POSTGRES_PASSWORD: symbi_local_dev
          POSTGRES_DB: symbi_dev
        ports:
          - 5432:5432
        # The job starts as soon as the container does, which is before the
        # server accepts connections. Gate on pg_isready instead.
        options: >-
          --health-cmd "pg_isready -U symbi -d symbi_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "IP_HASH_PEPPER=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Verify
        # security:scan, typecheck, test, build, and audit. Kept as one step so
        # CI cannot drift from what `npm run verify` does locally.
        run: npm run verify
