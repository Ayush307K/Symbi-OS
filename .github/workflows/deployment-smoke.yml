name: Production deployment smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  readiness:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify production database readiness
        env:
          PRODUCTION_URL: https://symbi-os-ten.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            "$PRODUCTION_URL/api/health/ready"

      - name: Verify complete production catalogue
        env:
          # Vercel's unique deployment URL is protected and redirects anonymous
          # CI requests to login. The production-success event is emitted only
          # after the canonical alias is assigned, so test that public alias.
          PRODUCTION_URL: https://symbi-os-ten.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            "$PRODUCTION_URL/api/stats")"
          LISTING_STATS="$payload" node -e '
            const stats = JSON.parse(process.env.LISTING_STATS);
            if (!Number.isInteger(stats.matches) || stats.matches < 148) {
              throw new Error(`Expected at least 148 active listings, received ${stats.matches}.`);
            }
            console.log(`Verified ${stats.matches} active marketplace listings.`);
          '
